[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haddu"
version = "0.1.0"
description = "Open-source satellite change detection engine monitoring forest encroachment in Thirthahalli, Western Ghats"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nachiketha K G" }
]
license = "MIT"
keywords = ["remote-sensing", "satellite", "sentinel-2", "stac", "postgis", "change-detection", "western-ghats"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pystac-client>=0.7.6",
    "odc-stac>=0.3.9",
    "planetary-computer>=1.0.0",
    "xarray>=2023.1.0",
    "rioxarray>=0.15.0",
    "dask>=2023.1.0",
    "rasterio>=1.3.8",
    "shapely>=2.0.0",
    "geopandas>=0.14.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "psycopg2-binary>=2.9.9",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["haddu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: integration tests requiring network access to STAC catalogs",
]

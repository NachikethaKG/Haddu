services:
  db:
    image: postgis/postgis:16-3.4
    container_name: haddu_postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: haddu_db
      POSTGRES_USER: haddu
      POSTGRES_PASSWORD: haddu_secret
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haddu -d haddu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: haddu_worker
    restart: unless-stopped
    command: ["python", "-m", "haddu.scripts.daemon", "--interval-hours", "24"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://haddu:haddu_secret@db:5432/haddu_db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./output:/app/output

volumes:
  postgis_data:
    driver: local

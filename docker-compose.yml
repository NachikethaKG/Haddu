services:
  db:
    image: postgis/postgis:16-3.4
    container_name: haddu_postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: haddu_db
      POSTGRES_USER: haddu
      POSTGRES_PASSWORD: haddu_secret
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haddu -d haddu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
    driver: local
